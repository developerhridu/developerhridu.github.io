name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Changes that don't affect the built site shouldn't trigger a deploy.
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - ".vscode/**"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Each admin save is a commit; only the newest one needs deploying.
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Build and deploy share one job: a second job means waiting for another runner
  # and re-downloading the artifact.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Restoring node_modules directly skips `npm ci` entirely when the lockfile is unchanged.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      # CMS save/publish/undo logic, review diff, link checks, content-health rules.
      # A failure stops the deploy, so a broken admin never goes live.
      - name: Test
        run: npm test

      # Resized WebP copies made by the prebuild step; it only redoes images whose content changed.
      - name: Cache responsive images
        uses: actions/cache@v6
        with:
          path: public/_img
          key: responsive-images-${{ hashFiles('public/images/**', 'scripts/generate-responsive-images.mjs', 'lib/imageWidths.mjs') }}
          restore-keys: |
            responsive-images-

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
